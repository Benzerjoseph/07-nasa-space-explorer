<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NASA Space Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
<link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
<div class="container">
<header class="site-header">
<img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
<h1>Space Explorer</h1>
</header>

<section class="fact" aria-live="polite">
<strong>🌌 Did You Know?</strong>
<p id="spaceFact"></p>
</section>

<div class="filters">
<input type="date" id="startDate" aria-label="Start date" />
<input type="date" id="endDate" aria-label="End date" />
<button id="getImages">Get Space Images</button>
</div>

<div id="gallery" class="gallery">
<div class="placeholder">
<div class="placeholder-icon">🔭</div>
<p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
</div>
</div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="modal-content">
<button id="modalClose" class="modal-close" aria-label="Close">&times;</button>
<div id="modalMedia" class="modal-media"></div>
<h2 id="modalTitle"></h2>
<p id="modalDate" class="modal-date"></p>
<p id="modalText"></p>
</div>
</div>

<script src="js/dateRange.js"></script>
<script src="js/script.js"></script>
</body>
</html>
